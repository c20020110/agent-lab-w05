<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>課間靈感｜活動挑選器</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182b29;
      --muted: #647875;
      --paper: #f5f6f0;
      --card: #fffefa;
      --line: #dce4da;
      --green: #176d5b;
      --green-dark: #105242;
      --mint: #e6f3ed;
      --orange: #d47a36;
      --orange-pale: #fff0df;
      --shadow: 0 18px 54px rgb(33 65 55 / 9%);
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 88% 0%, rgb(214 235 219 / 65%), transparent 33rem),
        var(--paper);
      line-height: 1.55;
    }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 11px; color: var(--green-dark); font-size: .88rem; font-weight: 800; letter-spacing: .12em; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: var(--green); color: white; letter-spacing: 0; }
    .language-switch { display: inline-flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgb(255 255 255 / 72%); }
    .language-switch button { min-width: 48px; padding: 7px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: .86rem; font-weight: 700; }
    .language-switch button[aria-pressed="true"] { background: var(--green); color: #fff; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) 240px; align-items: end; gap: 28px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 8px; color: var(--orange); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 680px; margin: 0; font-size: clamp(2.2rem, 5vw, 4.05rem); line-height: 1.08; letter-spacing: -.055em; }
    .intro-copy { max-width: 630px; margin: 15px 0 0; color: var(--muted); font-size: 1.03rem; }
    .illustration { position: relative; display: grid; width: 210px; height: 156px; justify-self: end; place-items: center; overflow: hidden; border: 1px solid rgb(23 109 91 / 10%); border-radius: 28px; background: linear-gradient(145deg, #e3f2e8, #fff4df); }
    .sun { position: absolute; top: 22px; right: 31px; width: 33px; height: 33px; border-radius: 50%; background: #f4b85f; }
    .hill { position: absolute; bottom: -45px; width: 220px; height: 115px; border-radius: 50%; background: #8fc3a2; transform: rotate(-12deg); }
    .hill.second { bottom: -58px; left: -35px; background: #5c9d7e; transform: rotate(13deg); }
    .card-icon { z-index: 1; display: grid; width: 67px; height: 76px; place-items: center; border: 3px solid #fff; border-radius: 16px; background: #fffefa; color: var(--green); font-size: 2rem; box-shadow: 0 10px 24px rgb(33 65 55 / 13%); transform: rotate(5deg); }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 18px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
    .picker { padding: 25px; }
    .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .panel-heading h2 { margin: 0; font-size: 1.18rem; letter-spacing: -.02em; }
    .panel-heading p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .step { display: inline-grid; width: 30px; height: 30px; flex: none; place-items: center; border-radius: 10px; background: var(--mint); color: var(--green-dark); font-size: .82rem; font-weight: 800; }
    .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 7px; color: var(--muted); font-size: .82rem; font-weight: 750; }
    .field select { width: 100%; min-height: 48px; padding: 10px 34px 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
    .field select:hover { border-color: #9bb8a7; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .primary, .secondary, .text-button { min-height: 44px; border-radius: 12px; font-weight: 750; }
    .primary { flex: 1; padding: 10px 18px; border: 1px solid var(--green); background: var(--green); color: #fff; box-shadow: 0 7px 16px rgb(23 109 91 / 17%); }
    .primary:hover { background: var(--green-dark); }
    .secondary { padding: 10px 15px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .secondary:hover { background: #f4f7f2; }
    .result { min-height: 175px; margin-top: 20px; padding: 19px; border: 1px dashed #b9d2c2; border-radius: 17px; background: linear-gradient(125deg, #f0f8f2, #fbfcf7); }
    .result-label { margin: 0 0 9px; color: var(--green); font-size: .77rem; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .result-empty { display: grid; min-height: 105px; place-items: center; color: var(--muted); text-align: center; }
    .result-empty p { max-width: 330px; margin: 0; }
    .result-empty.no-match { color: #92501f; }
    .activity-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; margin: 0; font-size: clamp(1.35rem, 3vw, 1.8rem); line-height: 1.25; }
    .activity-id { padding: 3px 8px; border-radius: 7px; background: var(--orange-pale); color: #9a541f; font-size: .78rem; font-weight: 850; letter-spacing: .04em; }
    .activity-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #dce9df; border-radius: 999px; background: rgb(255 255 255 / 78%); color: #35574d; font-size: .8rem; font-weight: 650; }
    .side { display: grid; gap: 18px; }
    .history { padding: 21px; }
    .history .panel-heading { align-items: center; margin-bottom: 12px; }
    .text-button { min-height: 36px; padding: 6px 10px; border: 0; background: transparent; color: var(--green); font-size: .85rem; }
    .text-button:hover { background: var(--mint); }
    .history-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .history-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 10px; border: 1px solid #edf0e9; border-radius: 12px; background: #fff; }
    .history-number { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 9px; background: var(--mint); color: var(--green-dark); font-size: .75rem; font-weight: 800; }
    .history-name { overflow-wrap: anywhere; font-size: .9rem; font-weight: 700; }
    .history-id { color: var(--muted); font-size: .74rem; font-weight: 700; }
    .history-empty { padding: 18px 10px; color: var(--muted); font-size: .9rem; text-align: center; }
    .note { display: flex; align-items: flex-start; gap: 11px; padding: 15px 17px; border: 1px solid #efdfc9; border-radius: 17px; background: #fff8ed; color: #76512e; font-size: .86rem; }
    .note-mark { display: grid; width: 25px; height: 25px; flex: none; place-items: center; border-radius: 8px; background: #f6e2c8; color: #92501f; font-weight: 850; }
    .note p { margin: 1px 0 0; }
    footer { margin-top: 24px; color: var(--muted); font-size: .78rem; text-align: center; }
    :focus-visible { outline: 3px solid #df8b45; outline-offset: 3px; }

    @media (max-width: 760px) {
      .intro { grid-template-columns: minmax(0, 1fr) 150px; gap: 16px; }
      .illustration { width: 145px; height: 125px; border-radius: 22px; }
      .content-grid { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr 1fr; align-items: start; }
    }
    @media (max-width: 540px) {
      .page { width: min(100% - 28px, 480px); padding: 18px 0 32px; }
      .topbar { margin-bottom: 23px; }
      .brand { font-size: .72rem; letter-spacing: .08em; }
      .intro { grid-template-columns: 1fr; }
      .illustration { display: none; }
      h1 { font-size: clamp(2.15rem, 11vw, 3.1rem); }
      .intro-copy { margin-top: 11px; font-size: .96rem; }
      .picker { padding: 19px; }
      .filters { grid-template-columns: 1fr; gap: 12px; }
      .field select { min-height: 50px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .primary { grid-column: 1 / -1; }
      .side { grid-template-columns: 1fr; }
      .history { padding: 18px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .panel { animation: enter .35s ease-out both; }
      .side .panel, .side .note { animation-delay: .06s; }
      @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span data-i18n="brand">CAMPUS PAUSE · 課間靈感</span></div>
      <nav class="language-switch" aria-label="Language / 語言" data-i18n-aria="languageLabel">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </nav>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">A LITTLE SPACE BETWEEN CLASSES</p>
        <h1 id="page-title" data-i18n="title">課間，我想做什麼？</h1>
        <p class="intro-copy" data-i18n="intro">選好地點、時間和今天的步調，讓一個剛剛好的小點子替你開場。</p>
      </div>
      <div class="illustration" aria-hidden="true"><span class="sun"></span><span class="hill"></span><span class="hill second"></span><span class="card-icon">✦</span></div>
    </section>

    <div class="content-grid">
      <section class="panel picker" aria-labelledby="picker-heading">
        <div class="panel-heading">
          <div><h2 id="picker-heading" data-i18n="pickerTitle">挑選一個適合現在的活動</h2><p data-i18n="pickerHelp">結果會同時符合以下三個條件。</p></div>
          <span class="step" aria-hidden="true">01</span>
        </div>
        <div class="filters">
          <div class="field"><label for="location" data-i18n="locationLabel">地點</label><select id="location"><option value="all" data-i18n="locationAll">不限地點</option><option value="indoor" data-i18n="indoor">室內</option><option value="outdoor" data-i18n="outdoor">室外</option></select></div>
          <div class="field"><label for="minutes" data-i18n="minutesLabel">可用時間</label><select id="minutes"><option value="15">15 <span data-i18n="minutesUnit">分鐘內</span></option><option value="30" selected>30 <span data-i18n="minutesUnit">分鐘內</span></option><option value="60">60 <span data-i18n="minutesUnit">分鐘內</span></option></select></div>
          <div class="field"><label for="energy" data-i18n="energyLabel">活動強度</label><select id="energy"><option value="all" data-i18n="energyAll">不限強度</option><option value="low" data-i18n="low">低</option><option value="medium" data-i18n="medium">中</option></select></div>
        </div>
        <div class="actions">
          <button class="primary" id="pick" type="button" data-i18n="pickButton">✦　幫我選一個</button>
          <button class="secondary" id="reset" type="button" data-i18n="resetButton">重設篩選</button>
        </div>
        <section class="result" aria-labelledby="result-label" aria-live="polite" aria-atomic="true">
          <p class="result-label" id="result-label" data-i18n="resultLabel">YOUR LITTLE PAUSE</p>
          <div id="result-content" class="result-empty"><p data-i18n="emptyPrompt">準備好時按下「幫我選一個」，看看這段時間可以怎麼過。</p></div>
        </section>
      </section>

      <aside class="side">
        <section class="panel history" aria-labelledby="history-heading">
          <div class="panel-heading"><div><h2 id="history-heading" data-i18n="historyTitle">最近抽選</h2><p data-i18n="historyHelp">只記錄這次開啟期間的成功結果</p></div><button type="button" class="text-button" id="clear" data-i18n="clearButton">清除紀錄</button></div>
          <ol class="history-list" id="history-list" aria-live="polite"><li class="history-empty" data-i18n="historyEmpty">還沒有抽選結果。</li></ol>
        </section>
        <div class="note"><span class="note-mark" aria-hidden="true">i</span><p data-i18n="simulation">教學模擬活動，不是校方公告。</p></div>
      </aside>
    </div>
    <footer data-i18n="footer">挑一件小事，留一點空間給自己。</footer>
  </main>

  <script>
    "use strict";
    const activities = [
      { id: "A01", name_zh: "整理書包", name_en: "Organize your bag", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A02", name_zh: "畫一張小卡", name_en: "Draw a small card", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A03", name_zh: "寫三句讀書筆記", name_en: "Write three study notes", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A04", name_zh: "安靜讀兩頁書", name_en: "Read two pages quietly", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A05", name_zh: "排好明日待辦", name_en: "Plan tomorrow’s tasks", location_type: "indoor", minutes: 20, energy: "low" },
      { id: "A06", name_zh: "整理本機練習檔", name_en: "Organize practice files", location_type: "indoor", minutes: 30, energy: "medium" },
      { id: "A07", name_zh: "在合適位置慢走", name_en: "Take a gentle walk in a suitable area", location_type: "outdoor", minutes: 15, energy: "low" },
      { id: "A08", name_zh: "觀察天空並畫草圖", name_en: "Observe the sky and sketch", location_type: "outdoor", minutes: 20, energy: "low" },
      { id: "A09", name_zh: "在合適位置快走", name_en: "Take a brisk walk in a suitable area", location_type: "outdoor", minutes: 30, energy: "medium" },
      { id: "A10", name_zh: "規劃小組練習", name_en: "Plan a group exercise", location_type: "indoor", minutes: 45, energy: "medium" },
      { id: "A11", name_zh: "記錄自然色彩", name_en: "Record colors in nature", location_type: "outdoor", minutes: 45, energy: "low" },
      { id: "A12", name_zh: "構思下一次社團活動", name_en: "Brainstorm a future club activity", location_type: "indoor", minutes: 60, energy: "medium" }
    ];

    const copy = {
      zh: {
        brand: "CAMPUS PAUSE · 課間靈感", languageLabel: "語言 / Language", eyebrow: "A LITTLE SPACE BETWEEN CLASSES",
        title: "課間，我想做什麼？", intro: "選好地點、時間和今天的步調，讓一個剛剛好的小點子替你開場。",
        pickerTitle: "挑選一個適合現在的活動", pickerHelp: "結果會同時符合以下三個條件。", locationLabel: "地點",
        locationAll: "不限地點", indoor: "室內", outdoor: "室外", minutesLabel: "可用時間", minutesUnit: "分鐘內",
        energyLabel: "活動強度", energyAll: "不限強度", low: "低", medium: "中", pickButton: "✦　幫我選一個",
        resetButton: "重設篩選", resultLabel: "YOUR LITTLE PAUSE", emptyPrompt: "準備好時按下「幫我選一個」，看看這段時間可以怎麼過。",
        noMatch: "沒有符合條件的活動。試著調整篩選條件再抽一次。", activityMinutes: "{n} 分鐘", locationType: "{value}地點",
        energyType: "{value}強度", lowEnergy: "低強度", mediumEnergy: "中強度", historyTitle: "最近抽選",
        historyHelp: "只記錄這次開啟期間的成功結果", clearButton: "清除紀錄", historyEmpty: "還沒有抽選結果。",
        simulation: "教學模擬活動，不是校方公告。", footer: "挑一件小事，留一點空間給自己。", pickAnnouncement: "已抽選 {name}，活動編號 {id}。",
        noMatchAnnouncement: "沒有符合條件的活動。", clearAnnouncement: "抽選紀錄已清除。", resetAnnouncement: "篩選已重設，抽選紀錄保留。"
      },
      en: {
        brand: "CAMPUS PAUSE · BETWEEN CLASSES", languageLabel: "Language / 語言", eyebrow: "A LITTLE SPACE BETWEEN CLASSES",
        title: "What shall I do between classes?", intro: "Choose a place, a time, and today's pace. Let one just-right idea get you started.",
        pickerTitle: "Find an activity for right now", pickerHelp: "Your result will match all three filters.", locationLabel: "Location",
        locationAll: "Any location", indoor: "Indoors", outdoor: "Outdoors", minutesLabel: "Time available", minutesUnit: "min or less",
        energyLabel: "Energy", energyAll: "Any energy", low: "Low", medium: "Medium", pickButton: "✦　Pick for me",
        resetButton: "Reset filters", resultLabel: "YOUR LITTLE PAUSE", emptyPrompt: "When you’re ready, pick an activity and see how to spend this little break.",
        noMatch: "No activities match these filters. Try changing a filter and pick again.", activityMinutes: "{n} min", locationType: "{value}",
        energyType: "{value} energy", lowEnergy: "Low", mediumEnergy: "Medium", historyTitle: "Recent picks",
        historyHelp: "Successful picks from this visit only", clearButton: "Clear history", historyEmpty: "No picks yet.",
        simulation: "Teaching simulation activity, not an official campus announcement.", footer: "Choose one small thing and make a little room for yourself.", pickAnnouncement: "Picked {name}, activity {id}.",
        noMatchAnnouncement: "No activities match these filters.", clearAnnouncement: "Pick history cleared.", resetAnnouncement: "Filters reset. Pick history kept."
      }
    };

    const locationSelect = document.getElementById("location");
    const minutesSelect = document.getElementById("minutes");
    const energySelect = document.getElementById("energy");
    const resultContent = document.getElementById("result-content");
    const historyList = document.getElementById("history-list");
    const liveStatus = document.createElement("span");
    liveStatus.className = "visually-hidden";
    liveStatus.setAttribute("role", "status");
    liveStatus.setAttribute("aria-live", "polite");
    document.querySelector("main").append(liveStatus);
    let language = "zh";
    let latestResult = null;
    let hasNoMatch = false;
    let history = [];

    function t(key, values = {}) {
      return Object.entries(values).reduce((text, [name, value]) => text.replaceAll(`{${name}}`, value), copy[language][key] || key);
    }
    function activityName(activity) { return language === "zh" ? activity.name_zh : activity.name_en; }
    function locationName(value) { return value === "indoor" ? t("indoor") : t("outdoor"); }
    function energyName(value) { return value === "low" ? t("lowEnergy") : t("mediumEnergy"); }

    function renderActivity(activity) {
      const title = document.createElement("h3");
      title.className = "activity-title";
      const name = document.createElement("span");
      name.textContent = activityName(activity);
      const id = document.createElement("span");
      id.className = "activity-id";
      id.textContent = activity.id;
      title.append(name, id);

      const meta = document.createElement("div");
      meta.className = "activity-meta";
      const values = [
        t("activityMinutes", { n: activity.minutes }),
        t("locationType", { value: locationName(activity.location_type) }),
        t("energyType", { value: energyName(activity.energy) })
      ];
      values.forEach((value) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = value;
        meta.append(chip);
      });
      resultContent.className = "";
      resultContent.replaceChildren(title, meta);
    }

    function renderHistory() {
      historyList.replaceChildren();
      if (!history.length) {
        const empty = document.createElement("li");
        empty.className = "history-empty";
        empty.textContent = t("historyEmpty");
        historyList.append(empty);
        return;
      }
      history.forEach((activity, index) => {
        const item = document.createElement("li");
        item.className = "history-item";
        const number = document.createElement("span");
        number.className = "history-number";
        number.textContent = String(index + 1).padStart(2, "0");
        const name = document.createElement("span");
        name.className = "history-name";
        name.textContent = activityName(activity);
        const id = document.createElement("span");
        id.className = "history-id";
        id.textContent = activity.id;
        item.append(number, name, id);
        historyList.append(item);
      });
    }

    function render() {
      document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        if (key === "minutesUnit") return;
        element.textContent = t(key);
      });
      document.querySelectorAll("[data-i18n-aria]").forEach((element) => element.setAttribute("aria-label", t(element.dataset.i18nAria)));
      document.querySelectorAll("[data-lang]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.lang === language)));
      [...minutesSelect.options].forEach((option) => { option.textContent = `${option.value} ${t("minutesUnit")}`; });
      if (latestResult) renderActivity(latestResult);
      else if (hasNoMatch) {
        resultContent.className = "result-empty no-match";
        const message = document.createElement("p");
        message.textContent = t("noMatch");
        resultContent.replaceChildren(message);
      }
      renderHistory();
    }

    document.getElementById("pick").addEventListener("click", () => {
      const selectedLocation = locationSelect.value;
      const maxMinutes = Number(minutesSelect.value);
      const selectedEnergy = energySelect.value;
      const matches = activities.filter((activity) =>
        (selectedLocation === "all" || activity.location_type === selectedLocation) &&
        activity.minutes <= maxMinutes &&
        (selectedEnergy === "all" || activity.energy === selectedEnergy)
      );
      if (!matches.length) {
        latestResult = null;
        hasNoMatch = true;
        resultContent.className = "result-empty no-match";
        const message = document.createElement("p");
        message.textContent = t("noMatch");
        resultContent.replaceChildren(message);
        liveStatus.textContent = t("noMatchAnnouncement");
        return;
      }
      latestResult = matches[Math.floor(Math.random() * matches.length)];
      hasNoMatch = false;
      history = [latestResult, ...history].slice(0, 5);
      renderActivity(latestResult);
      renderHistory();
      liveStatus.textContent = t("pickAnnouncement", { name: activityName(latestResult), id: latestResult.id });
    });

    document.getElementById("reset").addEventListener("click", () => {
      locationSelect.value = "all";
      minutesSelect.value = "30";
      energySelect.value = "all";
      liveStatus.textContent = t("resetAnnouncement");
    });
    document.getElementById("clear").addEventListener("click", () => {
      history = [];
      renderHistory();
      liveStatus.textContent = t("clearAnnouncement");
    });
    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => {
        language = button.dataset.lang;
        render();
      });
    });

    render();
  </script>
</body>
</html>
